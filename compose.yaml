services:
  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-practice_time}
      DB_USERNAME: ${DB_USERNAME:-practice_time}
      DB_PASSWORD: ${DB_PASSWORD:-practice_time}
    ports:
      - '${API_PORT:-3001}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-practice_time}
      POSTGRES_USER: ${DB_USERNAME:-practice_time}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-practice_time}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
