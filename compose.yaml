services:
  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-practice_time}
      DB_USERNAME: ${DB_USERNAME:-practice_time}
      DB_PASSWORD: ${DB_PASSWORD:-practice_time}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-practice-time-resources}
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:${LOCALSTACK_PORT:-4566}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      S3_FORCE_PATH_STYLE: 'true'
      S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-300}
      RESOURCE_MAX_UPLOAD_BYTES: ${RESOURCE_MAX_UPLOAD_BYTES:-15728640}
    ports:
      - '${API_PORT:-3001}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    init: true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-practice_time}
      POSTGRES_USER: ${DB_USERNAME:-practice_time}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-practice_time}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      PERSISTENCE: 1
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-practice-time-resources}
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  localstack-data:
